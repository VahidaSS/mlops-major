apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlops-app
  labels:
    app: mlops

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mlops

  template:
    metadata:
      labels:
        app: mlops

    spec:
      containers:
      - name: mlops-container

        image: vahidass/mlops-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: MODEL_PATH
          value: "savedmodel.pth"

        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"

          limits:
            memory: "256Mi"
            cpu: "500m"
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition MLOps System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            cursor: pointer;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5563d6;
        }

        #preview {
            margin-top: 20px;
            max-width: 220px;
            max-height: 220px;
            border-radius: 12px;
            display: none;
            border: 2px solid #ddd;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #f4f6ff;
            display: none;
        }

        .result-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .prediction {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .confidence {
            color: #27ae60;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }

        .loader {
            display: none;
            margin-top: 15px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Face Recognition MLOps System</h1>
        <p class="subtitle">Decision Tree Classifier | Olivetti Faces Dataset</p>

        <form id="uploadForm">
            <div class="upload-box">
                <input type="file" id="fileInput" name="file" accept="image/*" required onchange="previewImage(event)">
            </div>
            <button type="submit">Predict Face</button>
        </form>

        <div class="loader" id="loader">Processing image...</div>
        <img id="preview">

        <div class="result-box" id="resultBox">
            <div class="result-title">Prediction Result</div>
            <div class="prediction" id="prediction"></div>
            <div class="confidence" id="confidence"></div>
        </div>

        <div class="note">
            Upload a face image for classification.
            Non-face images will be rejected automatically.
        </div>

        <div class="footer">
            MLOps Major Assignment | Face Recognition System
        </div>
    </div>

    <script>
        function previewImage(event) {
            const preview = document.getElementById("preview");
            preview.src = URL.createObjectURL(event.target.files[0]);
            preview.style.display = "block";
        }

        document.getElementById("uploadForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const file = document.getElementById("fileInput").files[0];
            const formData = new FormData();
            formData.append("file", file);

            document.getElementById("loader").style.display = "block";
            document.getElementById("resultBox").style.display = "none";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                document.getElementById("loader").style.display = "none";
                document.getElementById("resultBox").style.display = "block";

                if (result.status === "success") {
                    document.getElementById("prediction").innerHTML = "Person ID: " + result.prediction;
                    document.getElementById("confidence").innerHTML = "Confidence: " + result.confidence + "%";
                } else {
                    document.getElementById("prediction").innerHTML = result.message;
                    document.getElementById("confidence").innerHTML = "";
                }
            } catch (error) {
                document.getElementById("loader").style.display = "none";
                alert("Prediction failed.");
            }
        });
    </script>
</body>

</html>
